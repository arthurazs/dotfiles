# --- Atom One Light Palette for Kitty ---

# Core UI Colors
background            #fafafa
foreground            #383a42
cursor                #526fff
cursor_text_color     #fafafa
selection_background  #e1e2e3
selection_foreground  #383a42

# Tab Bar Layout (Matches your Powerline style)
active_tab_foreground   #fafafa
active_tab_background   #4078f2
inactive_tab_foreground #a0a1a7
inactive_tab_background #eaeaea

# URL underlays
url_color             #0184bc

# The 16 Terminal ANSI Colors

# Black / Grey (Dark text layers)
color0  #383a42
color8  #a0a1a7

# Red (Errors, breaking structural indicators)
color1  #e45649
color9  #e45649

# Green (Strings, success states)
color2  #50a14f
color10 #50a14f

# Yellow (Warnings, minor types)
color3  #c18401
color11 #c18401

# Blue (Functions, primary keywords)
color4  #4078f2
color12 #4078f2

# Magenta (Control flow keys, constants)
color5  #a626a4
color13 #a626a4

# Cyan (Regex, special identifiers)
color6  #0184bc
color14 #0184bc

# White / Light background layers
color7  #fafafa
color15 #ffffff
